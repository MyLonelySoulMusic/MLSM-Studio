name: Installers and launchers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/installers.yml"
      - "scripts/**"
      - "tools/setup_python_runtime.cjs"
      - "tools/run_python_service.cjs"
      - "tools/platform_tools.cjs"
      - "tools/verify_node_dependencies.cjs"
      - "tools/verify_installation.cjs"
      - "tools/ai-quantizer/server.cjs"
      - "tools/installer.test.ts"
      - "tools/upscaler/requirements.txt"
      - "package.json"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/macos/*.sh
      - run: scripts/macos/install.sh --dry-run
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: "npm" }
      - run: npm ci --include=dev
      - run: scripts/macos/launch.sh --check
      - run: scripts/macos/build.sh --check
      - run: npx vitest run tools/installer.test.ts

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: scripts\windows\install.bat --dry-run
      - shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "mlsm-path-test"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          & scripts/windows/ensure-user-path.ps1 -Directory $target -DryRun
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: "npm" }
      - run: npm ci --include=dev
      - shell: cmd
        run: scripts\windows\launch.bat --check
      - shell: cmd
        run: scripts\windows\build.bat --check
      - run: npx vitest run tools/installer.test.ts
