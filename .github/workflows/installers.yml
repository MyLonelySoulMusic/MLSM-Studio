name: Installers and launchers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "install.*"
      - "launch-mlsm.*"
      - "tools/setup_python_runtime.cjs"
      - "tools/run_python_service.cjs"
      - "tools/verify_installation.cjs"
      - "tools/installer.test.ts"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: "npm" }
      - run: npm ci
      - run: bash -n install.sh launch-mlsm.sh tools/setup_ai_quantizer_env.sh tools/setup_upscaler_env.sh
      - run: ./launch-mlsm.sh --check
      - run: ./build-macos.sh --check
      - run: npx vitest run tools/installer.test.ts

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: "npm" }
      - run: npm ci
      - shell: cmd
        run: launch-mlsm.bat --check
      - shell: cmd
        run: install.bat --dry-run
      - shell: cmd
        run: build-windows.bat --check
      - run: npx vitest run tools/installer.test.ts
