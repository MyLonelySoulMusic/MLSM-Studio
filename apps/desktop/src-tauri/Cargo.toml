[package]
name = "dynamic-sound-animation-studio"
version = "0.1.0"
description = "Professional sound-reactive animation studio"
authors = ["Dynamic Sound Animation Studio contributors"]
edition = "2021"

[lib]
name = "dynamic_sound_animation_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
atomicwrites = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
